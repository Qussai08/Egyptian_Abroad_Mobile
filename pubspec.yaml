name: egyptians_abroad
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.1.3 <4.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 4.6.6
  flutter: 
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  get_storage: ^2.1.1
  flutter_offline: ^3.0.1
  otp_text_field: ^1.1.3
  dio: ^5.3.4


dev_dependencies: 
  flutter_lints: 3.0.1
  flutter_test: 
    sdk: flutter

  flutter_launcher_icons: '^0.9.2'

flutter_icons:
  android: "launcher_icon"
  remove_alpha_ios: true
  image_path: "assets/images/travel.png"

flutter: 
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: baloo
      fonts:
        - asset: assets/fonts/baloo_ar.ttf
        #   weight: 400
        # - asset: assets/fonts/Baloo2-Bold.ttf
        #   weight: 700
        # - asset: assets/fonts/Baloo2-ExtraBold.ttf
        #   weight: 800
        # - asset: assets/fonts/Baloo2-SemiBold.ttf
        #   weight: 600
        # - asset: assets/fonts/Baloo2-Medium.ttf
        #   weight: 500

