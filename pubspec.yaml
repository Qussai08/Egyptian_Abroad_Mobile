name: egyptians_abroad
version: 1.6.1+56
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  webview_flutter: ^4.5.0
  cupertino_icons: ^1.0.2
  get: 4.6.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  get_storage: ^2.1.1
  flutter_offline: ^3.0.1
  otp_text_field: ^1.1.3
  dio: ^5.3.4
  validators: ^3.0.0
  flutter_countdown_timer: ^4.1.0
  flutter_inappwebview: ^5.8.0
  intl: ^0.18.1
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.2
  flutter_html: ^3.0.0-alpha.1
  modal_bottom_sheet: ^2.1.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^11.0.1
  firebase_core: ^2.24.2
  flutter_svg: ^2.0.9
  jwt_decode: ^0.3.1
  showcaseview: ^2.0.3
  loader_overlay: 3.0.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  freerasp: ^6.4.0
  encrypt: ^5.0.3
  webview_flutter_wkwebview: ^3.13.0

dev_dependencies:
  flutter_lints: 3.0.1
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.9.2"

flutter_icons:
  android: "launcher_icon"
  remove_alpha_ios: true
  image_path: "assets/images/travel.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/avatars/

  fonts:
    - family: baloo
      fonts:
        - asset: assets/fonts/baloo_ar.ttf

